name: ParsLauncher Android Debug

on:
  workflow_dispatch:
  push:
    branches:
      - parslauncher-purple-ui
      - v3_openjdk
  pull_request:
    branches:
      - v3_openjdk

permissions:
  contents: read

jobs:
  build-arm64-debug:
    name: Build ARM64 debug APK (runtime download on first use)
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and build tools
        run: |
          sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"

      - name: Download LTW
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar \
            -O app_pojavlauncher/libs/ltw-release.aar

      # Download the verified Android runtime bundles from MojoLauncher releases.
      # The old PojavLauncherTeam repository is archived and no longer publishes Actions artifacts.
      - name: Download and unpack Java 8 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          curl -fL --retry 3 \
            https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre8-pojav.zip \
            -o /tmp/jre8-pojav.zip
          unzip -oq /tmp/jre8-pojav.zip -d app_pojavlauncher/src/main/assets/components/jre

      - name: Download and unpack Java 17 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          curl -fL --retry 3 \
            https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre17-pojav.zip \
            -o /tmp/jre17-pojav.zip
          unzip -oq /tmp/jre17-pojav.zip -d app_pojavlauncher/src/main/assets/components/jre-new

      - name: Download and unpack Java 21 runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          curl -fL --retry 3 \
            https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre21-pojav.zip \
            -o /tmp/jre21-pojav.zip
          unzip -oq /tmp/jre21-pojav.zip -d app_pojavlauncher/src/main/assets/components/jre-21

      - name: Verify bundled Java runtimes
        shell: bash
        run: |
          set -euo pipefail
          for runtime in jre jre-new jre-21; do
            dir="app_pojavlauncher/src/main/assets/components/$runtime"
            for archive in universal.tar.xz bin-arm64.tar.xz; do
              if [[ ! -s "$dir/$archive" ]]; then
                echo "::error::Required runtime archive missing: $dir/$archive"
                find "$dir" -maxdepth 2 -type f -printf '%p (%s bytes)\\n' || true
                exit 1
              fi
            done
            echo "Verified $runtime:"
            du -sh "$dir"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build launcher support modules
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17 for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runtime artifacts are intentionally not bundled here because the upstream
      # artifact workflows currently have no downloadable successful runs.
      # Users can install a compatible Java runtime from the launcher's runtime manager.
      - name: Assemble ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app_pojavlauncher:assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a

          # AGP may redirect the module build directory in this fork. Search the
          # complete checked-out workspace instead of assuming app_pojavlauncher/build.
          mapfile -t APK_CANDIDATES < <(
            find "$GITHUB_WORKSPACE" \
              -type d \( -name .git -o -name .gradle \) -prune -o \
              -type f -name '*.apk' -print
          )

          if [[ ${#APK_CANDIDATES[@]} -eq 0 ]]; then
            echo "::error::Gradle reported assembleDebug success, but no APK exists in the workspace."
            echo "Build directories:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type d \( -name build -o -name outputs -o -name apk \) -print || true
            echo "Recent build files:"
            find "$GITHUB_WORKSPACE" -type f \( -name '*.aab' -o -name '*.apk' \) -print || true
            exit 1
          fi

          for APK_CANDIDATE in "${APK_CANDIDATES[@]}"; do
            echo "Discovered APK candidate: $APK_CANDIDATE"
          done
          APK="${APK_CANDIDATES[0]}"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Discovered APK is empty: $APK"
            exit 1
          fi

          if ! unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then
            echo "::error::The generated APK does not contain ARM64 native libraries: $APK"
            unzip -l "$APK" | grep 'lib/' || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/ParsLauncher-arm64x-debug.apk
          echo "Packaged source APK: $APK"
          ls -lh dist/ParsLauncher-arm64x-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsLauncher-arm64x-debug
          path: dist/ParsLauncher-arm64x-debug.apk
          if-no-files-found: error
          compression-level: 0
